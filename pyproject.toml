[project]
name = "image-analysis-and-qa"
version = "0.1.0"
description = "YOLO object detection with question answering over detection results"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.121.2",
    "pillow~=12.0.0",
    "python-multipart~=0.0.20",
    "ultralytics==8.3.229",
    "uvicorn~=0.38.0",
    "pydantic-ai~=1.21.0",
    "python-dotenv~=1.2.1",
    "torch==2.9.1",
    "torchvision==0.24.1; sys_platform != 'linux' or platform_machine == 'aarch64'",
    "torchvision==0.24.1+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
